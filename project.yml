# XcodeGen spec. The .xcodeproj is generated (make generate) and gitignored.
name: anyfmt
options:
  bundleIdPrefix: dev.aiwithaj
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  DragSense:
    path: Packages/DragSense
  RadialMenu:
    path: Packages/RadialMenu
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

settings:
  base:
    ENGINES_DIST: $(SRCROOT)/Engines/dist

targets:
  # Engine, registry, router, jobs core, tool implementations. No UI.
  # Linked by the app, the CLI and the matrix runner.
  AnyfmtCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/Engine
      - path: Sources/Jobs/Core
      - path: Sources/Tools/Core
    settings:
      base:
        PRODUCT_NAME: AnyfmtCore
        PRODUCT_BUNDLE_IDENTIFIER: $(BRAND_BUNDLE_ID).core
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks @loader_path/Frameworks @loader_path/../Frameworks"

  App:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
      - path: Sources/Wheel
      - path: Sources/Cloud
      - path: Sources/Tools/Editors
      - path: Sources/Actions
      - path: Sources/Jobs/UI
      - path: Sources/Settings
      - path: LICENSES
        type: folder
        buildPhase: resources
    dependencies:
      - target: AnyfmtCore
        embed: true
      - target: CLI
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - package: DragSense
      - package: RadialMenu
      - package: Sparkle
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleName: $(BRAND_NAME)
        CFBundleDisplayName: $(BRAND_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "AGPL-3.0. Source: see About."
        NSAppleEventsUsageDescription: "Optional: lets $(BRAND_NAME) read your Finder selection when you press the shortcut, and export to Pages if you choose a Pages format. Nothing is sent anywhere."
        NSServices:
          - NSMenuItem:
              default: "Open in $(BRAND_NAME) Wheel"
            NSMessage: openWheelForFiles
            NSPortName: $(BRAND_NAME)
            NSRequiredContext: {}
            NSSendFileTypes:
              - public.item
        CFBundleURLTypes:
          - CFBundleURLName: $(BRAND_BUNDLE_ID)
            CFBundleURLSchemes:
              - $(BRAND_URL_SCHEME)
        # Sparkle: never checks unless the user opts in (Settings › General).
        SUEnableAutomaticChecks: false
        SUAutomaticallyUpdate: false
        SUEnableSystemProfiling: false
        SUFeedURL: "https://github.com/AatmanAJ/anyfmt/releases/latest/download/appcast.xml"
        SUPublicEDKey: "9bpyosf5ny/ai9Ww4gS0HQSGqy27V5sEaewoMiqr6pI="
    settings:
      base:
        PRODUCT_NAME: $(BRAND_NAME)
        # Fixed module name so a rename never touches `@testable import`.
        PRODUCT_MODULE_NAME: AnyfmtApp
        PRODUCT_BUNDLE_IDENTIFIER: $(BRAND_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    postBuildScripts:
      - name: Embed engines
        script: "\"$SRCROOT/scripts/embed-engines.sh\""
        basedOnDependencyAnalysis: false

  # `anyfmt` command-line tool, shipped inside the app at Contents/Helpers.
  CLI:
    type: tool
    platform: macOS
    sources:
      - path: Sources/CLI
    dependencies:
      - target: AnyfmtCore
        embed: false
    settings:
      base:
        PRODUCT_NAME: $(BRAND_SLUG)
        PRODUCT_MODULE_NAME: AnyfmtCLI
        PRODUCT_BUNDLE_IDENTIFIER: $(BRAND_BUNDLE_ID).cli
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks @executable_path"
        SKIP_INSTALL: YES

  # Runs every shipped route on its fixture and validates the output.
  Matrix:
    type: tool
    platform: macOS
    sources:
      - path: Tests/Matrix
    dependencies:
      - target: AnyfmtCore
        embed: false
    settings:
      base:
        PRODUCT_NAME: anyfmt-matrix
        PRODUCT_BUNDLE_IDENTIFIER: $(BRAND_BUNDLE_ID).matrix
        LD_RUNPATH_SEARCH_PATHS: "@executable_path"
        SKIP_INSTALL: YES

  CoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/Unit/Core
    dependencies:
      - target: AnyfmtCore
    settings:
      base:
        PRODUCT_NAME: AnyfmtCoreTests
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BRAND_BUNDLE_ID).coretests

  AppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/Unit/App
    dependencies:
      - target: App
    settings:
      base:
        PRODUCT_NAME: AnyfmtAppTests
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BRAND_BUNDLE_ID).apptests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/$(BRAND_NAME).app/Contents/MacOS/$(BRAND_NAME)"
        BUNDLE_LOADER: "$(TEST_HOST)"

  UITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/UI
    dependencies:
      - target: App
    settings:
      base:
        PRODUCT_NAME: AnyfmtUITests
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BRAND_BUNDLE_ID).uitests
        TEST_TARGET_NAME: App

schemes:
  anyfmt:
    build:
      targets:
        App: all
        CLI: all
        Matrix: all
        CoreTests: [test]
        AppTests: [test]
    run:
      config: Debug
      executable: App
    test:
      config: Debug
      gatherCoverageData: false
      environmentVariables:
        ANYFMT_ENGINES_DIR: $(ENGINES_DIST)
      targets:
        - CoreTests
        - AppTests
    archive:
      config: Release
  AnyfmtUI:
    build:
      targets:
        App: all
        UITests: [test]
    test:
      config: Debug
      targets:
        - UITests
