name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-latest   # Apple silicon (arm64)
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(find /Applications -maxdepth 1 -name "Xcode*.app" | sort -V | tail -1)" && xcodebuild -version

      - name: Tools
        run: brew install xcodegen meson ninja nasm pkg-config autoconf automake libtool

      - name: Cache engines
        id: engines
        uses: actions/cache@v4
        with:
          path: |
            Engines/dist
            Engines/build/src
          key: engines-${{ runner.os }}-${{ hashFiles('Engines/versions.env', 'Engines/build-*.sh', 'Engines/lib.sh') }}

      - name: Build engines (pinned sources)
        if: steps.engines.outputs.cache-hit != 'true'
        run: make engines

      - name: Build
        run: make build

      - name: Unit tests + policy checks
        run: make test
