name: Something's broken
description: A conversion fails, the wheel misbehaves, or the app crashes.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: The conversion, if it's one
      placeholder: e.g. HEIC → JPG, MOV → GIF with Width 480
  - type: input
    id: version
    attributes:
      label: anyfmt version
      description: Menu bar › About anyfmt.
      placeholder: e.g. 1.0.0 (2)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: e.g. macOS 15.4, MacBook Air M2
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Diagnostics
      description: Settings › Advanced › Copy Diagnostics, pasted here. It lists versions, engines and settings, with no file paths.
      render: text
