name: An idea
description: A format, tool or action you'd like, or a change to how something works.
labels: [idea]
body:
  - type: textarea
    id: what
    attributes:
      label: What you'd like
      description: What you're trying to do, and how anyfmt could help.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: The app, command or workaround you use now, if any.
